<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Carol的小爱心 ❤️ 手势/鼠标操控版</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; overflow: hidden;
        }
        #heartCanvas { display: block; }
        #cameraCanvas {
            position: absolute; bottom: 10px; right: 10px;
            width: 160px; height: 120px;
            transform: scaleX(-1); 
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; opacity: 0.4; z-index: 10;
        }
        #status {
            position: absolute; top: 20px; width: 100%;
            text-align: center; color: #ea80b0; font-family: sans-serif;
            font-size: 16px; z-index: 10; pointer-events: none;
            text-shadow: 0 0 10px #ea80b0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="status">正在初始化，请允许浏览器使用摄像头...</div>
    <canvas id="heartCanvas"></canvas>
    <canvas id="cameraCanvas"></canvas>
    <video id="inputVideo" style="display: none;" autoplay playsinline></video>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const cameraCanvas = document.getElementById('cameraCanvas');
        const cameraCtx = cameraCanvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const videoElement = document.getElementById('inputVideo');

        let width, height;
        let particles = [];

        // 状态标志
        let isCameraWorking = false; // 摄像头是否正常工作
        let handCenterX = -9999; 
        let handCenterY = -9999;
        let scaleMultiplier = 1.0;
        let mouseX = -9999, mouseY = -9999; // 鼠标坐标（备用方案）

        const CONFIG = {
            particleCount: 600,
            particleColor: '#e0e8ff',
            particleSize: 1.2,
            baseHeartScale: 16,
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 鼠标监听（降级方案）
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        class Particle {
            constructor(index, total) {
                this.shapeT = (index / total) * Math.PI * 2; 
                this.edgeOffset = (Math.random() - 0.5) * 3; 
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.angle = Math.random() * Math.PI * 2;
                this.orbitRadius = Math.random() * 1.5 + 0.5;
                this.speed = 0.05 * (0.5 + Math.random());
                this.size = Math.random() * CONFIG.particleSize + 0.5;
                this.alpha = Math.random() * 0.5 + 0.5;
                this.fadeSpeed = Math.random() * 0.02 + 0.01;
                this.alphaDirection = 1;
            }

            update() {
                let centerX = width / 2;
                let centerY = height / 2;
                
                // 根据状态决定跟随谁
                if (isCameraWorking && handCenterX > 0) {
                    // 跟随手势
                    centerX = handCenterX;
                    centerY = handCenterY;
                } else if (!isCameraWorking && mouseX > 0) {
                    // 跟随鼠标（备用模式）
                    centerX = mouseX;
                    centerY = mouseY;
                }

                const heartPoint = getHeartPoint(this.shapeT);
                const targetX = centerX + (heartPoint.x + this.edgeOffset) * CONFIG.baseHeartScale * scaleMultiplier;
                const targetY = centerY + (heartPoint.y + this.edgeOffset) * CONFIG.baseHeartScale * scaleMultiplier;

                this.angle += this.speed * 0.05;
                const offsetX = Math.cos(this.angle) * this.orbitRadius;
                const offsetY = Math.sin(this.angle) * this.orbitRadius;

                this.x += (targetX + offsetX - this.x) * 0.1;
                this.y += (targetY + offsetY - this.y) * 0.1;

                this.alpha += this.fadeSpeed * this.alphaDirection;
                if (this.alpha >= 1) { this.alpha = 1; this.alphaDirection = -1; }
                else if (this.alpha <= 0.1) { this.alpha = 0.1; this.alphaDirection = 1; }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(224, 232, 255, ${this.alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = CONFIG.particleColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < CONFIG.particleCount; i++) {
                particles.push(new Particle(i, CONFIG.particleCount));
            }
        }

        function animate() {
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // === 尝试加载摄像头 ===
        navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
            isCameraWorking = true; // 标记摄像头可用
            videoElement.srcObject = stream;
            videoElement.play();
            statusDiv.innerText = "摄像头已就绪，正在加载 AI 模型...";
            
            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            cameraUtils.start();

        }).catch((err) => {
            // 摄像头失败，自动降级为鼠标模式！
            isCameraWorking = false;
            statusDiv.innerText = "⚠️ 摄像头未开启，已自动切换为【鼠标跟随】模式 (移动鼠标试试)";
            statusDiv.style.color = "#ffaa00"; // 变成黄色提醒
            console.error("摄像头错误，已降级:", err);
        });

        // 加载 AI 模型（无论摄像头是否成功，都先加载着，以防后来权限打开了）
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if (!isCameraWorking) return; // 如果没摄像头，不执行识别

            cameraCtx.save();
            cameraCtx.clearRect(0, 0, cameraCanvas.width, cameraCanvas.height);
            cameraCtx.drawImage(results.image, 0, 0, cameraCanvas.width, cameraCanvas.height);
            cameraCtx.restore();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDiv.innerText = "手势操控中 ✨ 移动食指控制位置，捏合/张开控制大小";
                const landmarks = results.multiHandLandmarks[0];
                const indexFinger = landmarks[8];
                const thumbFinger = landmarks[4];

                handCenterX = (1 - indexFinger.x) * width;
                handCenterY = indexFinger.y * height;

                const dx = indexFinger.x - thumbFinger.x;
                const dy = indexFinger.y - thumbFinger.y;
                const distance = Math.sqrt(dx*dx + dy*dy);

                const mapScale = (distance - 0.05) / (0.3 - 0.05) * 1.5 + 0.5;
                scaleMultiplier += (Math.max(0.5, Math.min(2.0, mapScale)) - scaleMultiplier) * 0.15;

            } else {
                statusDiv.innerText = "未检测到手，请把手放在摄像头前 ✋";
                handCenterX = width / 2;
                handCenterY = height / 2;
                scaleMultiplier += (1.0 - scaleMultiplier) * 0.05;
            }
        });

        initParticles();
        animate();

    </script>
</body>
</html>
